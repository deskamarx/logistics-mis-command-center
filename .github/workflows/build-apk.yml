name: 🚀 Build APK & Deploy GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build Production Android APK
  # ─────────────────────────────────────────────
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set Up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: ✅ Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: 🔒 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🔨 Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📁 Prepare APK
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/AmayaLogisticsMIS_v3.0.0.apk
          echo "✅ APK built: $(du -sh output_apk/AmayaLogisticsMIS_v3.0.0.apk)"

      - name: ⬆️ Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmayaLogisticsMIS-Android-APK-v3
          path: output_apk/AmayaLogisticsMIS_v3.0.0.apk
          retention-days: 90

      - name: 🏷️ Delete Old Release (if exists)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          gh release delete v3.0.0 --yes 2>/dev/null || true
          git push --delete origin v3.0.0 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🎉 Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: "🚀 Amaya Logistics MIS — v3.0.0"
          body: |
            ## 📱 Amaya Logistics MIS & Command Center

            ### What's New in v3.0.0
            - ✅ **Full SPA web app** now live on GitHub Pages
            - ✅ **Production-grade Android app** with live sync to GitHub Pages
            - ✅ **Multi-user login** via Supabase (configurable)
            - ✅ **7 full dashboard modules**: Dashboard, P&L, Operations, Team, Spreadsheets, Alerts, Reports
            - ✅ **Demo data** with 360 days of realistic logistics transactions
            - ✅ **Offline support** — graceful offline page with retry button
            - ✅ **Pull-to-refresh** with branded colors
            - ✅ **CSV export** for all reports
            - ✅ **Admin settings** to connect Supabase for live database

            ### 📥 Install Instructions
            1. Download `AmayaLogisticsMIS_v3.0.0.apk` below
            2. On your Android device: Settings → Security → Enable "Install from Unknown Sources"
            3. Open the downloaded APK and install

            ### 🌐 Web App
            Live URL: **https://deskamarx.github.io/logistics-mis-command-center/**

            ### 🔐 Default Login (Demo Mode)
            - Email: `bahalul1964@gmail.com` (or any email)
            - Password: any (demo mode accepts any password)
            - *To enable real authentication, connect Supabase in Admin Settings*

            ### ⚙️ Supabase Setup (for real multi-user auth)
            1. Create a free account at [supabase.com](https://supabase.com)
            2. Create a new project
            3. Go to Admin Settings in the app and enter your Project URL and Anon Key

          files: output_apk/AmayaLogisticsMIS_v3.0.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 2: Deploy GitHub Pages
  # ─────────────────────────────────────────────
  deploy-pages:
    name: 🌐 Deploy GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
