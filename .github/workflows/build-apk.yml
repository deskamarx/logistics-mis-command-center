name: Build Production Android APK & Sync Live

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Production Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew || true

      - name: Build Debug & Release APKs
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon

      - name: Locate & Rename APK Asset
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/AmayaLogisticsMIS_v2.0.0.apk
          echo "APK generated at output_apk/AmayaLogisticsMIS_v2.0.0.apk"

      - name: Upload Android APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmayaLogisticsMIS-Android-APK
          path: output_apk/AmayaLogisticsMIS_v2.0.0.apk
          retention-days: 90

      - name: Create Live GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Release v2.0.0 - Amaya Logistics MIS Android APK"
          body: |
            ## 📱 Amaya Logistics MIS & Command Center Android App
            
            - **App Version:** 2.0.0
            - **Live Sync Engine:** Pre-configured with live InfinityFree backend & Google Sheets telemetry
            - **Target Account:** `bahalul1964@gmail.com`
            
            ### 📥 Download & Install
            Download **`AmayaLogisticsMIS_v2.0.0.apk`** below to install directly on any Android phone/tablet!
          files: output_apk/AmayaLogisticsMIS_v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
